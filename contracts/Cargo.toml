[workspace]
resolver = "2"
members = ["land-nft", "asset-nft", "svrs-token", "marketplace"]

[workspace.dependencies]
soroban-sdk = { version = "20.0.0", features = ["alloc"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
